global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:

  # ── Spring Boot Application ─────────────────
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'demo-app'

  # ── Redis ───────────────────────────────────
  - job_name: 'redis'
    scrape_interval: 10s
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis-primary'

  # ── Kafka ───────────────────────────────────
  - job_name: 'kafka'
    scrape_interval: 10s
    static_configs:
      - targets: ['kafka-exporter:9308']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'kafka-broker'

  # ── PostgreSQL ──────────────────────────────
  - job_name: 'postgresql'
    scrape_interval: 10s
    static_configs:
      - targets: ['postgres-exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres-primary'

  # ── Prometheus Self-Monitoring ──────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']