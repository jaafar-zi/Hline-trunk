spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hlinedb
    username: admin
    password: admin@*123
    driver-class-name: org.postgresql.Driver
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: localhost
    port: 1025
    username: admin
    password: admin
    properties:
      mail:
        smtp:
          trust: "*"
        auth: true
        starttls:
          enabled: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000
  security:
    mailing:
      frontend:
        activation-url: http://localhost:4200/activate-account
application:
  file:
    uploads:
      photos-output-path: ./uploads
server:
  port: 8088